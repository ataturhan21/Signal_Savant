[tool.poetry]
name = "signal-savant"
version = "0.1"
description = "A Python Telegram bot that fetches OHLCV data through CCXT, computes a volume/price ratio (VPR) and replies with a candlestick chart."
authors = ["invictus21 <ataturhan21@gmail.com>"]
readme = "README.md"
packages = [{include = "signal_savant"}]

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^1.26.2"
pandas = "^2.1.4"
plotly = "^5.18.0"
emoji = "^2.9.0"
apscheduler = "^3.10.4"
ccxt = "^4.2.1"
addict = "^2.4.0"
kaleido = "0.2.1"
python-dotenv = "^1.0.0"
aiogram = "2.5"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
